name: Feature request
description: Propose an API, algorithm, or documentation improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Public references
      description: List specifications, papers, or test vectors; do not paste third-party implementation source.
