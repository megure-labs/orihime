# Generated from the first-party contribution-policy.mjs; no candidate checkout.
name: Contribution policy
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: contribution-policy-${{ github.repository }}
  cancel-in-progress: false
jobs:
  disclosure:
    name: Validate contribution disclosure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            function visibleMarkdown(body) {
              const text=body||'';let result='',fence=null;
              for(let i=0;i<text.length;) {
                if(i===0||text[i-1]==='\n') {
                  const end=text.indexOf('\n',i),stop=end<0?text.length:end+1,line=text.slice(i,stop);
                  if(fence) {
                    if(new RegExp('^ {0,3}'+fence.char+'{'+fence.length+',}\\s*$').test(line))fence=null;
                    result+=line;i=stop;continue;
                  }
                  const start=/^ {0,3}(`{3,}|~{3,})(.*)$/.exec(line.trimEnd());
                  if(start){fence={char:start[1][0],length:start[1].length};result+=line;i=stop;continue;}
                }
                if(text.startsWith('<!--',i)) {
                  const end=text.indexOf('-->',i+4),stop=end<0?text.length:end+3;
                  result+=text.slice(i,stop).replace(/[^\n]/g,'');i=stop;continue;
                }
                if(text[i]==='`') {
                  let stop=i+1;while(text[stop]==='`')stop++;
                  const ticks=text.slice(i,stop);let end=text.indexOf(ticks,stop);
                  while(end>=0&&(text[end-1]==='`'||text[end+ticks.length]==='`'))end=text.indexOf(ticks,end+1);
                  if(end>=0){result+=text.slice(i,end+ticks.length);i=end+ticks.length;continue;}
                  result+=ticks;i=stop;continue;
                }
                result+=text[i++];
              }
              return result;
            }
            function missingSections(body) {
              const text=visibleMarkdown(body);
              const sections=new Map();let active=null,fence=null;
              for(const line of text.split(/\r?\n/)) {
                if(fence) {
                  const end=new RegExp('^ {0,3}'+fence.char+'{'+fence.length+',}\\s*$');
                  if(end.test(line))fence=null;
                  else if(active&&line.trim())sections.get(active).push('[nonempty code block]');
                  continue;
                }
                const start=/^ {0,3}(`{3,}|~{3,})(.*)$/.exec(line);
                if(start){fence={char:start[1][0],length:start[1].length};continue;}
                const heading=/^##\s+(.+?)\s*#*\s*$/.exec(line);
                if(heading){active=heading[1].trim().toLowerCase();if(!sections.has(active))sections.set(active,[]);}
                else if(active)sections.get(active).push(line);
              }
              return ['Summary','Human contribution','Agent contribution','External sources','Validation'].filter(name=>{
                const value=(sections.get(name.toLowerCase())||[]).join('\n').trim();
                return !value||/^(?:TBD|TODO|N\/A|\[replace[^\]]*\])\.?$/i.test(value);
              });
            }
            function incompletePulls(pulls,head) {
              const unique=new Map(pulls.filter(p=>p.state==='open'&&p.head?.sha===head).map(p=>[p.number,p]));
              return [...unique.values()].map(p=>({number:p.number,missing:missingSections(p.body)})).filter(p=>p.missing.length).sort((a,b)=>a.number-b.number);
            }
            async function openPulls(github,owner,repo) {
              const rows=[];
              for(let page=1;page<=10;page++) {
                // Commit association omits open companions once a SHA is on main.
                const {data,headers}=await github.rest.pulls.list({owner,repo,state:'open',per_page:100,page});
                rows.push(...data);
                if(!headers.link?.includes('rel="next"'))return rows;
              }
              throw Error('Too many open PRs; disclosure validation requires maintainer inspection.');
            }
            async function checkDisclosure(github,context,core) {
              const {owner,repo}=context.repo;
              const heads=new Set(),target_url=`${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
              const pending=async sha=>{
                if(!/^[0-9a-f]{40}$/.test(sha||'')||heads.has(sha))return;
                heads.add(sha);
                await github.rest.repos.createCommitStatus({owner,repo,sha,state:'pending',context:'Contribution disclosure',description:'Revalidating current PR disclosures',target_url});
              };
              // Invalidate the webhook's known heads BEFORE any lookup can fail. Keeping
              // these heads also clears stale failures when an incomplete companion moves.
              await pending(context.payload?.pull_request?.head?.sha);
              await pending(context.payload?.before);
              const related=await openPulls(github,owner,repo);
              for(const pr of related)await pending(pr.head?.sha);
              const {data:current}=await github.rest.pulls.get({owner,repo,pull_number:context.issue.number});
              await pending(current.head?.sha);
              const pulls=[...related.filter(p=>p.number!==current.number),current];
              const errors=[];
              for(const sha of heads) {
                const failures=incompletePulls(pulls,sha);
                await github.rest.repos.createCommitStatus({owner,repo,sha,
                  state:failures.length?'failure':'success',context:'Contribution disclosure',
                  description:failures.length?('Complete disclosures in PRs: '+failures.map(p=>'#'+p.number).join(', ')).slice(0,140):'All open PRs at this head disclose authorship, sources and validation',target_url});
                if(sha===current.head?.sha)errors.push(...failures.map(p=>'#'+p.number+': '+p.missing.join(', ')));
              }
              if(errors.length)core.setFailed([...new Set(errors)].join('\n'));
            }
            await checkDisclosure(github,context,core);
