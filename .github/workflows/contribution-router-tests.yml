name: Contribution router tests
on:
  pull_request:
    paths: ['.github/scripts/contribution-router*', '.github/workflows/contribution-routing.yml', '.github/workflows/contribution-router-tests.yml']
  push:
    branches: [main]
    paths: ['.github/scripts/contribution-router*', '.github/workflows/contribution-routing.yml', '.github/workflows/contribution-router-tests.yml']
permissions:
  contents: read
jobs:
  router-tests:
    name: Contribution router unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: node --test .github/scripts/contribution-router.test.mjs
