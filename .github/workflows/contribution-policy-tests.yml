name: Contribution policy tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  disclosure-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node --test .github/scripts/contribution-policy.test.mjs
